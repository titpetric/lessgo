---
version: "3"

# Writes every markdown file of the tree in one format, and lints the language.
# The formatter is splint, which reproduces what mdox wrote.

vars:
  folder: docs
  files: README.md

tasks:
  default:
    desc: "Check the markdown formatting and language"
    cmds:
      - task: lint

  fmt:
    desc: "Write every markdown file of the tree in one format"
    cmds:
      # --markdown keeps the fixer off the Go: the import rules belong to the
      # go:fmt task.
      - splint fix --markdown ./...

  lint:
    desc: "Run vale to lint language"
    cmds:
      # There is no formatting check. The formatter settles every question it
      # covers with no rule to configure, so a check would only report a file
      # nobody had run the formatter over.
      - docker run --rm -v $(pwd):/docs -w /docs jdkato/vale .

  prose:
    desc: "Report the constructions this tree leans on that the standard library does not"
    cmds:
      - splint --linters=prose --stats ./...

  setup:
    cmds:
      - go install github.com/titpetric/tools/splint@latest
